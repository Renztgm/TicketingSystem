name: Frontend CI/CD Automation

# Trigger the workflow on pushes or pull requests to the main branch
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    # Set the working directory to your backend folder if it's in a subdirectory
    defaults:
      run:
        working-directory: ./frontend
    steps:
      # Step 1: Clone the repository onto the GitHub runner machine
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js for the frontend build
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      # Step 3: Clean install project dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Build the production frontend bundle
      - name: Build Frontend
        run: npm run build

      # Step 5: Upload the production build as a workflow artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error